[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-forge"
version = "1.0.0"
description = "Deterministic, zero-trust agent orchestration kernel for Claude Opus 4.7 — the only orchestration framework architecturally capable of regulated deployment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Swarm-Forge Contributors" },
]
keywords = [
    "agentic-ai",
    "claude",
    "claude-opus-4-7",
    "orchestration",
    "dag",
    "zero-trust",
    "agent-orchestration",
    "ai-safety",
    "mcp",
    "fastmcp",
    "anthropic",
    "deterministic-execution",
    "ast-firewall",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic==2.9.2",
    "fastmcp==0.2.0",
    "jinja2==3.1.2",
    "filelock==3.13.1",
    "httpx==0.27.0",
    "anthropic==0.39.0",
    "opentelemetry-api==1.27.0",
    "python-dotenv==1.0.1",
    "tiktoken>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
]
dashboard = [
    "streamlit>=1.36.0",
    "flask>=3.0.0",
    "PyJWT>=2.8.0",
]

[project.urls]
Homepage = "https://github.com/f2025408135-cyber/SWARM-FORGE"
Repository = "https://github.com/f2025408135-cyber/SWARM-FORGE"
Issues = "https://github.com/f2025408135-cyber/SWARM-FORGE/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast, in-process tests with no network or subprocess dependencies",
]
